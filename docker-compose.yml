

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: sd-api
    environment:
      DATABASE_URL: postgresql://dba_admin:118100@postgres:5432/servicedesk
    ports:
      - "8000:8000"
    networks:
      - servers
    depends_on:
      postgres:
        condition: service_healthy

  notifier:
    build:
      context: .
      dockerfile: notifier/Dockerfile
    container_name: sd-notifier
    environment:
      DATABASE_URL: postgresql://dba_admin:118100@postgres:5432/servicedesk
    networks:
      - servers
    depends_on:
      postgres:
        condition: service_healthy

  # ===========================================================================
  # PostgreSQL 16 — ядро системы Service Desk
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: sd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ}
    ports:
      - "${POSTGRES_PORT}:5432"
    # /dev/shm по умолчанию 64 МБ: при больших таблицах PostgreSQL не может
    # выделить разделяемую память под параллельные запросы и VACUUM
    # («could not resize shared memory segment … No space left on device»).
    shm_size: 256mb
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    networks:
      - servers
      - admin
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # OpenLDAP — централизованный каталог пользователей
  # ===========================================================================
  ldap:
    build:
      context: ./ldap
      dockerfile: Dockerfile
    container_name: sd-ldap
    restart: unless-stopped
    environment:
      LDAP_ORGANISATION: ${LDAP_ORGANIZATION}
      LDAP_DOMAIN: ${LDAP_DOMAIN}
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD}
      LDAP_SEED_INTERNAL_LDIF_PATH: /container/service/slapd/assets/config/bootstrap/ldif/seed
    ports:
      - "389:389"
      - "636:636"
    networks:
      - servers
      - admin
    healthcheck:
      # Проверяем базу под администратором (анонимное чтение в каталоге запрещено)
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost -D 'cn=admin,dc=corp,dc=local' -w \"$$LDAP_ADMIN_PASSWORD\" -b 'dc=corp,dc=local' -s base > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  ldap-seed:
    image: osixia/openldap:1.5.0
    container_name: sd-ldap-seed
    environment:
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD}
    depends_on:
      ldap:
        condition: service_healthy
    volumes:
      - ./ldap/directory_load.ldif:/seed/directory_load.ldif:ro
      - ./ldap/bootstrap_extra.ldif:/seed/bootstrap_extra.ldif:ro
    networks:
      - servers
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        ldapsearch -x -H ldap://ldap -D "cn=admin,dc=corp,dc=local" -w "$${LDAP_ADMIN_PASSWORD:-118100}" -b "uid=n.skvortsova,ou=people,dc=corp,dc=local" -s base >/dev/null 2>&1
        || (ldapadd -c -x -H ldap://ldap -D "cn=admin,dc=corp,dc=local" -w "$${LDAP_ADMIN_PASSWORD:-118100}" -f /seed/directory_load.ldif; ldapadd -c -x -H ldap://ldap -D "cn=admin,dc=corp,dc=local" -w "$${LDAP_ADMIN_PASSWORD:-118100}" -f /seed/bootstrap_extra.ldif; exit 0)

  # ===========================================================================
  # docker-mailserver — почтовый сервер (Postfix + Dovecot + LDAP auth)
  # ===========================================================================
  mail:
    image: docker.io/mailserver/docker-mailserver:latest
    container_name: sd-mail
    restart: unless-stopped
    hostname: mail.corp.local
    domainname: corp.local
    environment:
      # --- Отключаем тяжёлые дополнительные сервисы (для учебного стенда) ---
      ENABLE_SPAMASSASSIN: "0"
      ENABLE_CLAMAV: "0"
      ENABLE_FAIL2BAN: "0"
      ENABLE_POSTGREY: "0"
      ENABLE_MANAGESIEVE: "0"
      ENABLE_FETCHMAIL: "0"
      SPOOF_PROTECTION: "1"
      PERMIT_DOCKER: "connected-networks"

      # --- Аутентификация и каталог через OpenLDAP (DMS v16) ---
      ACCOUNT_PROVISIONER: "LDAP"
      LDAP_SERVER_HOST: "ldap://ldap"
      LDAP_BIND_DN: "cn=admin,dc=corp,dc=local"
      LDAP_BIND_PW: ${LDAP_ADMIN_PASSWORD}
      LDAP_SEARCH_BASE: "dc=corp,dc=local"
      LDAP_QUERY_FILTER_DOMAIN: "(|(mail=*@%s)(mailAlias=*@%s)(mailGroupMember=*@%s))"
      LDAP_QUERY_FILTER_USER: "(&(objectClass=inetOrgPerson)(mail=%s))"
      LDAP_QUERY_FILTER_ALIAS: "(&(objectClass=inetOrgPerson)(mailAlias=%s))"
      LDAP_QUERY_FILTER_GROUP: "(&(objectClass=inetOrgPerson)(mailGroupMember=%s))"
      LDAP_QUERY_FILTER_SENDERS: "(&(objectClass=inetOrgPerson)(|(mail=%s)(mailAlias=%s)))"

      # --- Dovecot (доступ к ящикам по IMAP через LDAP) ---
      DOVECOT_USER_FILTER: "(&(objectClass=inetOrgPerson)(mail=%{user}))"
      DOVECOT_PASS_ATTRS: "uid=user,userPassword=password"
      DOVECOT_USER_ATTRS: "=home=/var/mail/%{ldap:uid},=mail=maildir:~/Maildir,uidNumber=uid,gidNumber=gid"

      # --- SASL (аутентификация SMTP через LDAP) ---
      ENABLE_SASLAUTHD: "1"
      SASLAUTHD_MECHANISMS: "ldap"
      SASLAUTHD_LDAP_FILTER: "(&(mail=%U@corp.local)(objectClass=inetOrgPerson))"
    ports:
      - "25:25"
      - "143:143"
      - "587:587"
      - "993:993"
    volumes:
      - mailconfig:/tmp/docker-mailserver
      - maildata:/var/mail
      - mailstate:/var/mail-state
    networks:
      - servers
      - admin
    depends_on:
      ldap:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_unprivileged_port_start=0

networks:
  users:
    driver: bridge
  servers:
    driver: bridge
  admin:
    driver: bridge

volumes:
  pgdata:
  mailconfig:
  maildata:
  mailstate:
